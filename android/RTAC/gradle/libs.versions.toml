[versions]
agp = "9.3.3"
appcompat = "1.8.0"
dagger = "2.49"
fragment = "1.6.2"
guavaAndroid = "28.1-android"
guavaJre = "28.1-jre"
jackson = "2.6.7.1"
junit = "4.13.2"
kotlinStdlibConstraint = "1.8.10"
mockito-core = "5.24.0"
okhttp = "3.10.0"
robolectric = "4.7.1"
rxandroid2 = "2.1.1"       # 2.1.1 is the last common version for RxJava2 and RxAndroid2
testEspressoCore = "3.7.0"
testExtJunit = "1.3.0"
truth = "1.1.5"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "testEspressoCore" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
guava-android = { module = "com.google.guava:guava", version.ref = "guavaAndroid" }
guava-jre = { module = "com.google.guava:guava", version.ref = "guavaJre" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-stdlib-jdk7 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk7", version.ref = "kotlinStdlibConstraint" }
kotlin-stdlib-jdk8 = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlinStdlibConstraint" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito-core" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
rxandroid2 = { group = "io.reactivex.rxjava2", name = "rxandroid", version.ref = "rxandroid2" }
rxjava2 = { group = "io.reactivex.rxjava2", name = "rxjava", version.ref = "rxandroid2" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
